info:
  name: GetUserAndRepos
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{host}}/graphql"
  headers:
    - name: X-GitHub-Api-Version
      value: 2022-11-28
    - name: Accept
      value: application/vnd.github+json
  body:
    query: |
      query ($login: String!) {
        user(login: $login) {
          login
          name
          company
          location
          followers(first: 10) {
            nodes {
              login
              name
              company
              location
            }
          }
          repositories(first: 100) {
            totalCount
            totalDiskUsage
            pageInfo {
              hasNextPage
            }
            nodes {
              name
              diskUsage
              languages(first: 10) {
                nodes {
                  name
                  color
                }
              }
            }
          }
        }
      }
    variables: |-
      {
        "login": "{{user}}"
      }
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
