opencollection: 1.0.0

info:
  name: GitHub
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: X-GitHub-Api-Version
      value: 2022-11-28
    - name: Accept
      value: application/vnd.github+json
  variables:
    - name: user
      value: mathieu-lemay
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
